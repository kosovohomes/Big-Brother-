name: Deploy to Vercel (production)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: vercel-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Check for Vercel credentials
        id: creds
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::notice::VERCEL_TOKEN secret is not configured yet — deploy skipped. Add it in Repo Settings → Secrets and variables → Actions (a Vercel token from the kosovohomes@gmail.com account) to enable automatic deployments on every push."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Deploy (remote build on Vercel)
        if: steps.creds.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # Project identifiers (not secrets): kosovohomes personal scope.
          VERCEL_ORG_ID: Fy5PMKmfojPoqOdXnfR55Mgq
          VERCEL_PROJECT_ID: prj_NQWhczO1bb9THpur6KHGHArEtbdL
        run: |
          npm i -g vercel@latest
          vercel deploy --prod --yes --token "$VERCEL_TOKEN"
